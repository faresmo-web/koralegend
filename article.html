    <script src="script.js?v=2.1" defer></script>
    <script>
        const API_BASE = '';

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            let articleUrl = params.get('url');

            if (!articleUrl) {
                const slug = params.get('slug');
                const id = params.get('id');
                if (slug && id) {
                    articleUrl = `/كرة-قدم/أخبار/${slug}/${id}`;
                } else {
                    showError('لم يتم تحديد الخبر.');
                    return;
                }
            } else {
                // Decode from base64
                try {
                    articleUrl = decodeURIComponent(escape(atob(articleUrl)));
                } catch(e) {
                    // fallback: maybe it's a plain URL
                    try { articleUrl = decodeURIComponent(articleUrl); } catch(e2) {}
                }
            }

            try {
                const res = await fetch(`${API_BASE}/api/article?url=${encodeURIComponent(articleUrl)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const article = await res.json();
                renderArticle(article);
            } catch (e) {
                console.error('Article load error:', e);
                showError('تعذر تحميل الخبر. <a href="news">العودة للأخبار</a>');
            }
        }

        function renderArticle(a) {
            // Update page title
            document.title = `${a.headline} - KORA LEGEND`;

            const firstTag = a.tags?.[0] || 'أخبار';
            const tagsHtml = a.tags?.length
                ? `<div class="article-tags">${a.tags.map(t => `<span class="article-tag">${t}</span>`).join('')}</div>`
                : '';

            document.getElementById('articleContent').innerHTML = `
                ${firstTag ? `<span class="article-category-badge">${firstTag}</span>` : ''}
                <h1 class="article-headline">${a.headline}</h1>
                ${a.teaser ? `<p class="article-teaser">${a.teaser}</p>` : ''}
                <div class="article-meta">
                    ${a.date   ? `<span>🕐 ${a.date}</span>` : ''}
                    ${a.author ? `<span>✍️ ${a.author}</span>` : ''}
                </div>
                ${a.image ? `<img src="${a.image}" alt="${a.headline}" class="article-hero-img" loading="lazy">` : ''}
                <!-- Ad Unit: Inside Article -->
                <div class="ad-container ad-horizontal" style="max-width:100%;">
                    <span class="ad-label">إعلان</span>
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-8486549501295296"
                         data-ad-slot="YYYYYYYYYY"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
                </div>
                <div class="article-body">${a.body}</div>
                ${tagsHtml}
            `;
        }

        function showError(msg) {
            document.getElementById('articleContent').innerHTML = `
                <div class="article-error">
                    <div class="error-icon">📰</div>
                    <p>${msg}</p>
                </div>
            `;
        }

        loadArticle();
    </script>
