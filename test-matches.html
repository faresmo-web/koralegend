<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Matches Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
        }
        .match-item {
            padding: 10px;
            margin: 10px 0;
            background: #0f3460;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-live {
            background: #ff3b30;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        .status-finished {
            background: #666;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        .status-upcoming {
            background: #1b75f0;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>اختبار حالة المباريات</h1>
    
    <div class="test-section">
        <h2>المباريات من البيانات:</h2>
        <div id="testResults"></div>
    </div>

    <script>
        // Test data
        const testMatches = [
            {
                id: "1",
                homeTeam: "تشيلسي",
                awayTeam: "توتنهام",
                homeScore: 2,
                awayScore: 1,
                status: "96'",
                isLive: true,
                isFinished: false
            },
            {
                id: "2",
                homeTeam: "بورنموث",
                awayTeam: "مانشستر سيتي",
                homeScore: 1,
                awayScore: 1,
                status: "انتهت",
                isLive: false,
                isFinished: true
            },
            {
                id: "3",
                homeTeam: "كوكيبمو أونيدو",
                awayTeam: "ديبورتيس توليما",
                homeScore: null,
                awayScore: null,
                status: "لم تبدأ",
                isLive: false,
                isFinished: false
            }
        ];

        function displayTestResults() {
            const container = document.getElementById('testResults');
            
            testMatches.forEach(match => {
                const isLive = match.isLive;
                const isFinished = match.isFinished;
                const isUpcoming = !isLive && !isFinished;
                
                let statusClass = '';
                let statusText = '';
                let scoreDisplay = '';
                
                if (isUpcoming) {
                    statusClass = 'status-upcoming';
                    statusText = 'قادمة';
                    scoreDisplay = 'VS';
                } else if (isLive) {
                    statusClass = 'status-live';
                    statusText = match.status + ' (مباشر)';
                    scoreDisplay = `${match.homeScore} - ${match.awayScore}`;
                } else if (isFinished) {
                    statusClass = 'status-finished';
                    statusText = match.status;
                    scoreDisplay = `${match.homeScore} - ${match.awayScore}`;
                }
                
                const matchDiv = document.createElement('div');
                matchDiv.className = 'match-item';
                matchDiv.innerHTML = `
                    <div>
                        <strong>${match.homeTeam} vs ${match.awayTeam}</strong>
                        <div style="margin-top: 5px;">
                            النتيجة: ${scoreDisplay}
                        </div>
                    </div>
                    <div>
                        <span class="${statusClass}">${statusText}</span>
                        <div style="margin-top: 5px; font-size: 11px; opacity: 0.7;">
                            isLive: ${isLive}, isFinished: ${isFinished}
                        </div>
                    </div>
                `;
                
                container.appendChild(matchDiv);
            });
        }

        displayTestResults();
    </script>
</body>
</html>
