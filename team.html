    <style>
        .team-page { max-width: 1000px; margin: 0 auto; padding: var(--spacing-xl) 0; }

        /* Hero Card */
        .team-hero {
            background: linear-gradient(135deg, rgba(13,20,44,0.9) 0%, rgba(6,9,25,0.97) 100%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: var(--spacing-lg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            margin-bottom: var(--spacing-lg);
            display: flex;
            gap: var(--spacing-lg);
            align-items: center;
        }
        .team-hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: var(--gradient-1);
        }
        .team-hero-img-wrap {
            flex-shrink: 0;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: var(--spacing-sm);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .team-hero-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
        }
        .team-hero-info { flex: 1; }
        .team-hero-name {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 6px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .team-hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .team-meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Tabs Navigation */
        .team-tabs {
            display: flex;
            background: rgba(13,20,44,0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: var(--spacing-lg);
            backdrop-filter: blur(10px);
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        .team-tabs::-webkit-scrollbar { display: none; } /* Chrome/Safari */
        .team-tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 8px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
        }
        .team-tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.02);
        }
        .team-tab-btn.active {
            color: var(--text-primary);
            background: var(--gradient-1);
            box-shadow: 0 4px 15px rgba(27,117,240,0.3);
        }

        /* Content Panels */
        .team-panel {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .team-panel.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Squad section styling */
        .squad-section { margin-bottom: 2rem; }
        .squad-pos-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 1.5rem 0 1rem;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .squad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .player-card:hover {
            border-color: rgba(0, 102, 255, 0.4);
            transform: translateY(-3px);
            background: var(--card-hover-bg);
            box-shadow: var(--shadow-md), 0 0 15px rgba(0,102,255,0.15);
        }
        .player-card-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-card-info { flex: 1; min-width: 0; }
        .player-card-name {
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .player-card-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Info Tab Styling */
        .info-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
        }
        .info-block {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: var(--spacing-md);
            text-align: center;
        }
        .info-block-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .info-block-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Loading indicator styling */
        .team-loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }
        .team-loading .spin {
            font-size: 3rem;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Scroll to Top button */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.2rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            margin-bottom: var(--spacing-md);
            cursor: pointer;
        }
        .btn-back:hover {
            background: var(--gradient-1);
            border-color: transparent;
            box-shadow: 0 0 15px rgba(27,117,240,0.3);
        }

        @media (max-width: 768px) {
            .team-hero { flex-direction: column; text-align: center; }
            .team-hero-img-wrap { width: fit-content; margin: 0 auto; }
            .team-hero-meta { justify-content: center; }
            .squad-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .squad-grid { grid-template-columns: 1fr; }
        }
    </style>
