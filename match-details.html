        /* Dedicated premium page styles */
        .match-details-container {
            padding: var(--spacing-xl) 0;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .back-button-container {
            margin-bottom: var(--spacing-md);
        }
        
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-back:hover {
            background: var(--gradient-1);
            border-color: transparent;
            transform: translateX(-5px);
            box-shadow: 0 0 15px rgba(27, 117, 240, 0.4);
        }
        
        /* Premium Match Card Header */
        .match-hero-card {
            background: linear-gradient(135deg, rgba(13, 20, 44, 0.85) 0%, rgba(6, 9, 25, 0.95) 100%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: var(--spacing-lg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            margin-bottom: var(--spacing-lg);
            backdrop-filter: blur(15px);
        }
        
        .match-hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-3);
        }
        
        .match-hero-league {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: var(--spacing-md);
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .match-hero-league-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        
        .match-hero-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: var(--spacing-md) 0;
        }
        
        .match-hero-team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: var(--spacing-sm);
        }
        
        .match-hero-team-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s ease;
        }
        
        .match-hero-team:hover .match-hero-team-logo {
            transform: scale(1.08);
        }
        
        .match-hero-team-name {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .match-hero-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xs);
            min-width: 160px;
        }
        
        .match-hero-score {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-primary);
        }
        
        .score-live-pulse {
            position: relative;
            color: #ff6b6b;
            text-shadow: 0 0 15px rgba(255, 107, 107, 0.9);
            animation: pulse 1.5s infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        .match-hero-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .match-hero-status.live {
            background: #c0392b;
            border: 1px solid #e74c3c;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(192, 57, 43, 0.5);
        }
        
        .match-hero-status.finished {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
        }
        
        .match-hero-status.upcoming {
            background: rgba(27, 117, 240, 0.15);
            border: 1px solid rgba(27, 117, 240, 0.4);
            color: var(--primary-color);
        }
        
        .match-hero-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .meta-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .meta-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        /* Premium Navigation Tabs */
        .details-tabs {
            display: flex;
            background: rgba(13, 20, 44, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: var(--spacing-lg);
            backdrop-filter: blur(10px);
        }
        
        .details-tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .details-tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .details-tab-btn.active {
            color: var(--text-primary);
            background: var(--gradient-1);
            box-shadow: 0 4px 15px rgba(27, 117, 240, 0.3);
        }
        
        /* Dynamic Tab Panels */
        .tab-panel {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .tab-panel.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 1. Events Timeline Styles */
        .events-timeline {
            position: relative;
            margin: var(--spacing-md) 0;
        }
        
        .events-timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(-50%);
        }
        
        .timeline-event-wrapper {
            display: flex;
            margin-bottom: var(--spacing-lg);
            position: relative;
            align-items: center;
            width: 100%;
        }
        
        .timeline-event-item {
            width: 44%;
            padding: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        
        .timeline-event-item:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        /* RTL: home = right side, away = left side */
        .timeline-event-wrapper.home {
            flex-direction: row-reverse;
        }
        
        .timeline-event-wrapper.away {
            flex-direction: row;
        }
        
        /* Spacer to push card to correct side */
        .timeline-event-wrapper::before {
            content: '';
            flex: 1;
        }
        
        .timeline-minute-badge {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--dark-bg);
            border: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-primary);
            z-index: 2;
            box-shadow: 0 0 10px rgba(27, 117, 240, 0.3);
            flex-shrink: 0;
        }
        
        .timeline-event-wrapper.away .timeline-minute-badge {
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(255, 81, 0, 0.3);
        }
        
        .event-type-icon {
            margin-left: 8px;
            font-size: 1.15rem;
            display: inline-block;
            vertical-align: middle;
        }
        
        .event-player {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1rem;
        }
        
        .event-detail {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* 2. Stats Panel Styles */
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: var(--spacing-lg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .stat-row-item {
            margin-bottom: var(--spacing-lg);
        }
        
        .stat-labels {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        
        .stat-label-title {
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .stat-bars-container {
            display: flex;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            gap: 2px;
        }
        
        .stat-bar-home {
            background: var(--gradient-1);
            border-radius: 4px 0 0 4px;
            transition: width 0.6s cubic-bezier(0.1, 0.8, 0.2, 1);
        }
        
        .stat-bar-away {
            background: var(--gradient-2);
            border-radius: 0 4px 4px 0;
            transition: width 0.6s cubic-bezier(0.1, 0.8, 0.2, 1);
        }
        
        /* 3. Lineups Panel Styles */
        .lineups-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }
        
        .team-lineup-column {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: var(--spacing-md);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .team-lineup-column.away::before {
            background: var(--secondary-color);
        }
        
        .lineup-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-xs);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .lineup-sub-heading {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin: var(--spacing-md) 0 var(--spacing-xs) 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 4px;
        }
        
        .team-lineup-column.away .lineup-sub-heading {
            color: var(--secondary-color);
        }
        
        .player-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .player-list-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        
        .player-list-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(-3px);
        }
        
        .player-number {
            width: 26px;
            height: 26px;
            background: rgba(27, 117, 240, 0.15);
            border: 1px solid rgba(27, 117, 240, 0.3);
            color: var(--primary-color);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin-left: 12px;
        }
        
        .team-lineup-column.away .player-number {
            background: rgba(255, 81, 0, 0.15);
            border: 1px solid rgba(255, 81, 0, 0.3);
            color: var(--secondary-color);
        }
        
        .player-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        
        .coach-wrapper {
            margin-top: var(--spacing-md);
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .match-hero-main {
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between;
                align-items: center;
                gap: 5px;
            }
            .match-hero-team {
                width: 33%;
                flex: none;
                gap: 5px;
            }
            .match-hero-team-logo {
                width: 70px;
                height: 70px;
            }
            .match-hero-team-name {
                font-size: 1rem;
                line-height: 1.2;
            }
            .match-hero-center {
                min-width: 100px;
                width: 34%;
                flex: none;
            }
            .match-hero-score {
                font-size: 2.2rem;
                gap: 5px;
            }
            
            .lineups-split {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
            
            .events-timeline::before {
                left: 20px;
                transform: none;
            }
            
            .timeline-event-wrapper,
            .timeline-event-wrapper.home,
            .timeline-event-wrapper.away {
                flex-direction: row;
                padding-left: 50px;
            }
            
            .timeline-event-wrapper::before {
                display: none;
            }
            
            .timeline-event-item {
                width: 100%;
            }
            
            .timeline-minute-badge {
                left: 0;
                transform: none;
            }
        }

        @media (max-width: 480px) {
            .match-hero-card {
                padding: 1rem;
                border-radius: 16px;
            }
            .match-hero-team-logo {
                width: 55px;
                height: 55px;
            }
            .match-hero-team-name {
                font-size: 0.8rem;
            }
            .match-hero-score {
                font-size: 1.8rem;
            }
            .match-hero-status {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
            .match-hero-meta {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 1rem;
                padding-top: 1rem;
            }
            .meta-label {
                font-size: 0.65rem;
            }
            .meta-value {
                font-size: 0.8rem;
            }
        }

        /* Pitch responsive */
        #lineupsContainer {
            width: 100%;
        }
        
        @media (max-width: 500px) {
            #lineupsContainer [style*="width:32px"] {
                width: 26px !important;
                height: 26px !important;
            }
        }
    </style>
