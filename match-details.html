            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid rgba(255,81,0,0.12);
            background: rgba(0,0,0,0.2);
        }

        .zone-btn {
            padding: 0.45rem 1.1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
        }

        .zone-btn:hover {
            background: rgba(255,81,0,0.1);
            border-color: rgba(255,81,0,0.3);
            color: #ff5100;
        }

        .zone-btn.active {
            background: rgba(255,81,0,0.18);
            border-color: rgba(255,81,0,0.5);
            color: #ff5100;
            box-shadow: 0 0 10px rgba(255,81,0,0.2);
        }

        /* ── Event watch button style ── */
        .event-watch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 14px;
            background: rgba(255, 81, 0, 0.12);
            border: 1px solid rgba(255, 81, 0, 0.35);
            border-radius: 8px;
            color: #ff5100;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .event-watch-btn:hover {
            background: rgba(255, 81, 0, 0.25);
            border-color: rgba(255, 81, 0, 0.55);
            transform: translateY(-1.5px);
            box-shadow: 0 6px 15px rgba(255, 81, 0, 0.2);
        }

        /* ── Clips Drawer ── */
        #clipsDrawer {
            margin-top: 1rem;
            background: linear-gradient(135deg, rgba(13,20,44,0.95) 0%, rgba(6,9,25,0.98) 100%);
            border: 1px solid rgba(255,81,0,0.25);
            border-radius: 16px;
            overflow: hidden;
            animation: drawerSlideIn 0.3s ease;
        }

        @keyframes drawerSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .clips-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.1rem;
            background: rgba(255,81,0,0.08);
            border-bottom: 1px solid rgba(255,81,0,0.15);
            font-weight: 700;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        #clipsDrawerBody .stream-iframe-wrap {
            border-radius: 0;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <a href="matches" class="logo" style="text-decoration: none; color: inherit;">
                    <picture><source srcset="logo.webp" type="image/webp"><img src="logo.png" alt="Football World" class="logo-img" width="55" height="55"></picture>
                    <h1 class="logo-text">KORA LEGEND</h1>
                </a>
                
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                
                <nav class="main-nav">
                    <ul>
                        <li><a href="matches" class="nav-link active" data-en="Matches" data-ar="المباريات">المباريات</a></li>
                        <li><a href="news" class="nav-link" data-en="News" data-ar="الأخبار">الأخبار</a></li>

                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="match-details-container">
            <!-- Back Button -->
            <div class="back-button-container">
                <a href="matches" class="btn-back">
                    <span data-en="← Back to Matches" data-ar="← العودة للمباريات">← العودة للمباريات</span>
                </a>
            </div>

            <!-- Match Hero Card -->
            <section class="match-hero-card" id="matchHeroCard">
                <!-- Will be populated dynamically -->
            </section>

            <!-- Ad Unit: Under Match Hero -->
            <div class="ad-container ad-horizontal" style="margin-bottom: var(--spacing-md);">
                <span class="ad-label">إعلان</span>
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-8486549501295296"
                     data-ad-slot="YYYYYYYYYY"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <!-- Navigation Tabs -->
            <nav class="details-tabs">
                <button class="details-tab-btn" id="tab-stream" data-tab="stream">
                    <span class="stream-badge">🔴 LIVE</span> مشاهدة مباشرة
                </button>
                <button class="details-tab-btn active" data-tab="events" data-en="Match Events" data-ar="أحداث المباراة">أحداث المباراة</button>
                <button class="details-tab-btn" data-tab="stats" data-en="Statistics" data-ar="الإحصائيات">الإحصائيات</button>
                <button class="details-tab-btn" data-tab="lineups" data-en="Lineups" data-ar="التشكيلة">التشكيلة</button>
                <button class="details-tab-btn" data-tab="standings" data-en="Standings" data-ar="الترتيب">الترتيب</button>
            </nav>

            <!-- Stream Panel -->
            <section class="tab-panel" id="panel-stream">
                <!-- Main broadcast: always stays here -->
                <div id="mainStreamContainer">
                    <!-- Populated by JS -->
                </div>

                <!-- Clips Drawer: appears below when user clicks a goal clip -->
                <div id="clipsDrawer" style="display:none;">
                    <div class="clips-drawer-header">
                        <span id="clipDrawerTitle">⚽ اللقطة</span>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <a id="clipDrawerExtLink" href="#" target="_blank" rel="noopener" class="btn-stream-ext" style="display:none; font-size:0.78rem; padding:4px 10px;">🌐 نافذة جديدة</a>
                            <button onclick="closeClipsDrawer()" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:var(--text-secondary); border-radius:8px; padding:4px 10px; cursor:pointer; font-family:inherit; font-size:0.82rem;">✕ إغلاق</button>
                        </div>
                    </div>
                    <div id="clipsDrawerBody">
                        <!-- Clip iframe/tweet will be injected here -->
                    </div>
                </div>
            </section>

            <!-- Events Panel -->
            <section class="tab-panel active" id="panel-events">
                <div class="events-timeline" id="eventsTimeline">
                    <!-- Events populated dynamically -->
                </div>
            </section>

            <!-- Stats Panel -->
            <section class="tab-panel" id="panel-stats">
                <div class="stats-card" id="statsCard">
                    <!-- Stats populated dynamically -->
                </div>
            </section>

            <!-- Lineups Panel -->
            <section class="tab-panel" id="panel-lineups">
                <div id="lineupsContainer">
                    <!-- Lineups populated dynamically -->
                </div>
            </section>

            <!-- Standings Panel -->
            <section class="tab-panel" id="panel-standings">
                <div class="standings-card" id="standingsContainer">
                    <!-- Standings populated dynamically -->
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <picture><source srcset="logo.webp" type="image/webp"><img src="logo.png" alt="Football World" class="footer-logo-img" width="40" height="40"></picture>
                    <p>KORA LEGEND</p>
                </div>
                <p class="footer-text" data-en="© YEAR FARES. All rights reserved." data-ar="© YEAR FARES. جميع الحقوق محفوظة.">© 2026 FARES. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <!-- Database Scripts -->
    <script src="matches-data.js?v=2.3" defer></script>
    <script src="match-details-data.js?v=2.3" defer></script>
    <script src="script.js?v=2.3" defer></script>
    <script src="match-details.js?v=2.3" defer></script>
    <script src="live-details.js?v=2.3" defer></script>
</body>
</html>
