    <style>
        /* ── League Hero Header ── */
        .league-hero {
            background: linear-gradient(135deg, rgba(20,20,40,0.95) 0%, rgba(10,10,30,0.98) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 2.5rem 0 0;
        }
        .league-hero-inner {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding-bottom: 1.5rem;
        }
        .league-hero-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 20px rgba(255,193,7,0.3));
            border-radius: 12px;
        }
        .league-hero-logo-placeholder {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.07);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        .league-hero-info h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin: 0 0 0.25rem;
        }
        .league-hero-info .league-country {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ── Tabs ── */
        .league-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid rgba(255,255,255,0.07);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .league-tabs::-webkit-scrollbar { display: none; }
        .league-tab {
            padding: 0.85rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
        }
        .league-tab.active {
            color: #fff;
            border-bottom-color: var(--accent, #f5c518);
        }
        .league-tab:hover { color: #fff; }

        /* ── Tab Content ── */
        .league-tab-content {
            display: none;
            padding: 1.5rem 0;
            animation: fadeIn 0.3s ease;
        }
        .league-tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:translateY(0);} }

        /* ── Standings Table ── */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        .standings-table thead tr {
            background: rgba(255,255,255,0.04);
        }
        .standings-table th {
            padding: 0.65rem 0.5rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .standings-table th:first-child { text-align: right; padding-right: 1rem; }
        .standings-table tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .standings-table tbody tr:hover { background: rgba(255,255,255,0.04); }
        .standings-table td {
            padding: 0.65rem 0.5rem;
            text-align: center;
            color: #e0e0e0;
        }
        .standings-table td:first-child { text-align: right; padding-right: 1rem; }
        .standing-pos {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.82rem;
        }
        .pos-top { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .pos-qual { background: rgba(16,185,129,0.15); color: #34d399; }
        .pos-rel { background: rgba(239,68,68,0.15); color: #f87171; }
        .team-cell {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .team-cell img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* ── Top Players ── */
        .top-players-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .player-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
            cursor: pointer;
        }
        .player-row:hover { background: rgba(255,255,255,0.06); }
        .player-rank {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(245,197,24,0.1);
            border: 1px solid rgba(245,197,24,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #f5c518;
            flex-shrink: 0;
        }
        .player-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.07);
            flex-shrink: 0;
        }
        .player-info { flex: 1; min-width: 0; }
        .player-name { font-weight: 700; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-team { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
        .player-stat { font-size: 1.3rem; font-weight: 800; color: #f5c518; }
        .player-stat-label { font-size: 0.72rem; color: var(--text-secondary); }

        /* ── Match Summary List ── */
        .summary-match-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .summary-match-item:hover { background: rgba(255,255,255,0.06); }
        .summary-team { flex: 1; font-size: 0.88rem; font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 0.5rem; }
        .summary-team img { width: 22px; height: 22px; object-fit: contain; }
        .summary-score-block { text-align: center; min-width: 70px; }
        .summary-score { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 2px; }
        .summary-time { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .summary-live-badge {
            background: #c0392b;
            border: 1px solid #e74c3c;
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 8px;
            animation: pulse 1.5s infinite alternate;
        }

        /* ── News Card ── */
        .league-news-grid { display: flex; flex-direction: column; gap: 0.75rem; }
        .league-news-card {
            display: flex;
            gap: 1rem;
            padding: 0.85rem 1rem;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }
        .league-news-card:hover { background: rgba(255,255,255,0.07); }
        .league-news-img {
            width: 90px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.07);
        }
        .league-news-body { flex: 1; min-width: 0; }
        .league-news-title { font-size: 0.9rem; font-weight: 700; color: #fff; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .league-news-date { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.4rem; }

        /* ── Info Tab ── */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .info-card {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            padding: 1.1rem 1rem;
        }
        .info-card-label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.3rem; }
        .info-card-value { font-size: 1rem; font-weight: 700; color: #fff; }
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; margin-top: 1.5rem; }
        .team-card-mini {
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }
        .team-card-mini img { width: 36px; height: 36px; object-fit: contain; }
        .team-card-mini span { font-size: 0.78rem; color: #ccc; font-weight: 600; }

        /* ── Loader ── */
        .league-loader {
            display: flex;
            justify-content: center;
            padding: 3rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent, #f5c518);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Back Button ── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: var(--text-secondary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #fff; }

        @media (max-width: 500px) {
            .info-grid { grid-template-columns: 1fr; }
            .league-hero-info h1 { font-size: 1.4rem; }
            .league-hero-logo { width: 60px; height: 60px; }
        }
    </style>
